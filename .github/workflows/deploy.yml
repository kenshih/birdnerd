name: Deploy to GitHub Pages

on:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Gate the deploy on lint + unit tests (not just the build)
      - run: npm run lint
      - run: npm test

      - run: npm run build
      - run: npm run build:ocr
      - run: npm run build:sync-db
        env:
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.VITE_SUPABASE_PUBLISHABLE_KEY }}

      - name: Assemble Pages artifact
        run: |
          rm -rf site
          mkdir -p site/ocr site/sync-db
          cp -R apps/field/dist/. site/
          cp -R apps/ocr/dist/. site/ocr/
          cp -R apps/sync-db/dist/. site/sync-db/

      - uses: actions/upload-pages-artifact@v5
        with:
          path: site

      - uses: actions/deploy-pages@v5
        id: deployment
