# Payload contract for `membership.preauthorized` v1.
$schema: https://json-schema.org/draft/2020-12/schema
title: membership.preauthorized v1
type: object
required: [membership_id, email, role]
properties:
  membership_id:
    type: string
    format: uuid
    pattern: ^[0-9a-f]{8}-[0-9a-f]{4}-7[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$
  email:
    type: string
    format: email
  role:
    enum: [admin, contributor]
additionalProperties: false
