# Payload contract for `user-account.linked` v1.
$schema: https://json-schema.org/draft/2020-12/schema
title: user-account.linked v1
type: object
required: [user_account_id, identity]
properties:
  user_account_id:
    type: string
    format: uuid
    pattern: ^[0-9a-f]{8}-[0-9a-f]{4}-7[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$
  identity:
    type: object
    required: [provider, subject, email]
    properties:
      provider:
        const: google
      subject:
        type: string
        minLength: 1
      email:
        type: string
        format: email
    additionalProperties: false
additionalProperties: false
