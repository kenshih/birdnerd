$schema: https://json-schema.org/draft/2020-12/schema
title: band.received v1
type: object
required: [band_id, band_number]
properties:
  band_id: { type: string, format: uuid, pattern: '^[0-9a-f]{8}-[0-9a-f]{4}-7[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$' }
  band_number: { type: string }
  fields:
    type: object
    properties:
      band_size: { oneOf: [{ type: string }, { const: null }] }
      band_type: { oneOf: [{ type: string }, { const: null }] }
    additionalProperties: false
additionalProperties: false
