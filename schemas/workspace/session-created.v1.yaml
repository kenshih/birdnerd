$schema: https://json-schema.org/draft/2020-12/schema
title: session.created v1
type: object
required: [session_id]
properties:
  session_id:
    type: string
    format: uuid
    pattern: ^[0-9a-f]{8}-[0-9a-f]{4}-7[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$
  session_date:
    type: string
  location_name:
    type: string
  protocol:
    type: string
  notes:
    type: string
additionalProperties: false
