$schema: https://json-schema.org/draft/2020-12/schema
title: banding-record.created v1
type: object
required: [record_id, session_id]
properties:
  record_id:
    type: string
    format: uuid
    pattern: ^[0-9a-f]{8}-[0-9a-f]{4}-7[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$
  session_id:
    type: string
    format: uuid
    pattern: ^[0-9a-f]{8}-[0-9a-f]{4}-7[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$
  band_number:
    type: string
  species_code:
    type: string
  age:
    type: string
  sex:
    type: string
  capture_time:
    type: string
  notes:
    type: string
additionalProperties: false
